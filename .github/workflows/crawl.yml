name: Crawl Events

on:
  schedule:
    # Every 15 minutes, 24/7. GitHub Actions cron is always UTC.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Only checked out for config/keywords.yaml — no Go toolchain here,
      # the binary comes pre-built from build.yml's "latest" release.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            config

      - name: Download crawler binary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download latest --repo "${{ github.repository }}" --pattern crawler --clobber
          chmod +x crawler

      - name: Run crawler
        env:
          # Only the secrets for whichever STORE_BACKEND you actually use
          # need to exist — an unset secret just resolves to an empty
          # string here, which the crawler already treats as "not set".
          STORE_BACKEND: ${{ secrets.STORE_BACKEND }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEETS_SPREADSHEET_ID: ${{ secrets.GOOGLE_SHEETS_SPREADSHEET_ID }}
          GOOGLE_SHEETS_SHEET_NAME: ${{ secrets.GOOGLE_SHEETS_SHEET_NAME }}
        run: |
          set +e
          ./crawler 2>&1 | tee crawler.log
          exit_code="${PIPESTATUS[0]}"

          # Surface every per-site error as a visible (but non-failing)
          # annotation on the run — some sites (dunamu, at least) are
          # blocked from GitHub Actions' own IP ranges specifically, not
          # broken, and one such site shouldn't turn every scheduled run
          # red and drown out an actual regression. A run only stays
          # failed if it never reached the final "done:" summary line at
          # all (config/store setup failed, or every site failed) —
          # anything that got that far ran to completion and just wants
          # its errors on record.
          while IFS= read -r line; do
            if [[ "$line" == *"ERROR:"* ]]; then
              echo "::warning::${line#*ERROR: }"
            fi
          done < crawler.log

          if [ "$exit_code" -ne 0 ]; then
            if grep -q "done: fetched=" crawler.log; then
              echo "::warning::Crawl finished with site errors above — see this run's warnings."
              exit 0
            fi
            echo "::error::Crawler exited before finishing a run (config/store setup failure) — see the log."
            exit "$exit_code"
          fi
